services:
  - type: web
    name: pattern-mirror
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOW_DEMO_FALLBACK
        value: "0"