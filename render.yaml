services:
  - type: web
    name: stencil-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOW_DEMO_FALLBACK
        value: "1"
      - key: CORS_ORIGINS
        value: "*"

# Render Workflows are created in the Dashboard (Blueprint support pending).
# See workflows/README.md — root task: orchestrate_stencil
